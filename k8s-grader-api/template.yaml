AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  SAM Template for k8s-grader-api
# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Parameters:
  SecretHash:
    Type: String
    Description: "Secret hash for secure operations"
    Default: "hyKOuny4vy94RUiYe3pB6CCwtaJeW6B_fOtqbK1PXrQ="
  StageName:
    Type: String
    Description: "Stage name for the API"
    Default: "Prod"
  EasterEggSheetId:
    Type: String
    Description: "Sheet ID for Easter Egg"
    Default: "1rxJQs32TlMDHubPgwMPgVFo3fx_hMuYRSL0ic3db9RM"
  NCPBackgroundSheetId:
    Type: String
    Description: "Sheet ID for NCP Background"
    Default: "1VdQsc9qslvd-gGhydN5dEZEX6Q5uliBQqRguJyHBZM4"
  PythonVersion:
    Type: String
    Description: "Python version for the Lambda functions"
    Default: "python3.14"
Globals:
  Function:
    Timeout: 29
    MemorySize: 512
    Handler: app.lambda_handler
    Runtime: !Ref PythonVersion
    Architectures:
      - x86_64
  Api:
    TracingEnabled: true
Resources:
  TestResultBucket:
    Type: AWS::S3::Bucket

  ExamWebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-exam-web-${AWS::AccountId}-${AWS::Region}"
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        IgnorePublicAcls: false
        BlockPublicPolicy: false
        RestrictPublicBuckets: false

  ExamWebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ExamWebsiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: "*"
            Action:
              - s3:GetObject
            Resource: !Sub "arn:aws:s3:::${ExamWebsiteBucket}/*"

  ExamWebsiteCloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${AWS::StackName} exam website"
        DefaultRootObject: index.html
        HttpVersion: http2
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: ExamWebsiteS3WebsiteOrigin
            DomainName: !Sub "${ExamWebsiteBucket}.s3-website-${AWS::Region}.amazonaws.com"
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: http-only
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          Compress: true
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          TargetOriginId: ExamWebsiteS3WebsiteOrigin
          ViewerProtocolPolicy: redirect-to-https
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  GameSourceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-game-source-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  ApiKeyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: "email"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "email"
          KeyType: "HASH"

  AccountTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: "email"
          AttributeType: "S"
        - AttributeName: "endpoint"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "email"
          KeyType: "HASH"
      GlobalSecondaryIndexes:
        - IndexName: "EndpointIndex"
          KeySchema:
            - AttributeName: "endpoint"
              KeyType: "HASH"
          Projection:
            ProjectionType: "INCLUDE"
            NonKeyAttributes:
              - "email"

  TestRecordTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: "email"
          AttributeType: "S"
        - AttributeName: "gameTime"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "email"
          KeyType: "HASH"
        - AttributeName: "gameTime"
          KeyType: "RANGE"

  NpcLockTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: "email"
          AttributeType: "S"
        - AttributeName: "gameNpc"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "email"
          KeyType: "HASH"
        - AttributeName: "gameNpc"
          KeyType: "RANGE"
      TimeToLiveSpecification:
        AttributeName: "ttl"
        Enabled: true
  
  NpcBackgroundTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: "name"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "name"
          KeyType: "HASH"

  ConversationTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: "key"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "key"
          KeyType: "HASH"

  GameSourceTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: "game"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "game"
          KeyType: "HASH"

  GameAccessTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: "game"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "game"
          KeyType: "HASH"

  ExamCodeTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: "examCode"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "examCode"
          KeyType: "HASH"

  ExamSessionTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: "email"
          AttributeType: "S"
        - AttributeName: "examCode"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "email"
          KeyType: "HASH"
        - AttributeName: "examCode"
          KeyType: "RANGE"

  ExamWsConnectionTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: "connection_id"
          AttributeType: "S"
        - AttributeName: "email"
          AttributeType: "S"
        - AttributeName: "scope"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "connection_id"
          KeyType: "HASH"
      GlobalSecondaryIndexes:
        - IndexName: "EmailScopeIndex"
          KeySchema:
            - AttributeName: "email"
              KeyType: "HASH"
            - AttributeName: "scope"
              KeyType: "RANGE"
          Projection:
            ProjectionType: "ALL"

  # New refactored tables
  TaskStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: "email"
          AttributeType: "S"
        - AttributeName: "gameTask"
          AttributeType: "S"
        - AttributeName: "status"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "email"
          KeyType: "HASH"
        - AttributeName: "gameTask"
          KeyType: "RANGE"
      GlobalSecondaryIndexes:
        - IndexName: "StatusIndex"
          KeySchema:
            - AttributeName: "email"
              KeyType: "HASH"
            - AttributeName: "status"
              KeyType: "RANGE"
          Projection:
            ProjectionType: "ALL"

  NpcAssignmentTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: "email"
          AttributeType: "S"
        - AttributeName: "game"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "email"
          KeyType: "HASH"
        - AttributeName: "game"
          KeyType: "RANGE"

# Handle CORS https://github.com/aws/serverless-application-model/issues/1786
  ApiGatewayApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "${AWS::StackName}-api"
      StageName: !Ref StageName
      Auth:
        ApiKeyRequired: false
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,x-api-key'"
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        MaxAge: "'600'"
        AllowCredentials: false

  # Gateway Responses to add CORS headers to error responses
  ApiGatewayResponse4XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,x-api-key'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
      ResponseType: DEFAULT_4XX
      RestApiId: !Ref ApiGatewayApi

  ApiGatewayResponse5XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,x-api-key'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
      ResponseType: DEFAULT_5XX
      RestApiId: !Ref ApiGatewayApi

  APIUsagePlan:
    Type: 'AWS::ApiGateway::UsagePlan'
    Properties:
      ApiStages:
        - ApiId: !Ref ApiGatewayApi
          Stage: !Ref ApiGatewayApi.Stage
      Description: To usage plan and api key in REST API.
      Quota:
        Limit: 2880
        Period: DAY
      Throttle:
        BurstLimit: 60
        RateLimit: 60
      UsagePlanName: !Sub "${AWS::StackName}-usage-plan"

  ExamWebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${AWS::StackName}-exam-ws"
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.action"

  ExamWebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref ExamWebSocketApi
      StageName: !Ref StageName
      AutoDeploy: true

  LibLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: LibLayer
      Description: A layer for shared libraries
      ContentUri: layer
      RetentionPolicy: Delete
      CompatibleRuntimes:
        - !Ref PythonVersion
    Metadata:
      BuildMethod: makefile # Required to have AWS SAM build this layer

  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: CommonLayer
      Description: Dependencies required for my Python lambdas
      ContentUri: common-layer/
      RetentionPolicy: Delete
      CompatibleRuntimes:
       - !Ref PythonVersion  
      LicenseInfo: "Apache License 2.0"
    Metadata:
      BuildMethod: !Ref PythonVersion

  SaveK8sAccountFunction:
    Type: AWS::Serverless::Function 
    Properties:
      CodeUri: save-k8s-account/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AccountTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ApiKeyTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TestRecordTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NpcLockTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NpcBackgroundTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GameSourceTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GameAccessTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ExamCodeTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ExamSessionTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GameAccessTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ExamCodeTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ExamSessionTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GameAccessTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ExamCodeTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ExamSessionTable
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: "*"
      Layers:
        - !Ref LibLayer
        - !Ref CommonLayer
      Environment:
        Variables:
          AccountTable: !Ref AccountTable
          ApiKeyTable: !Ref ApiKeyTable
          SecretHash: !Ref SecretHash
          TestRecordTable: !Ref TestRecordTable
          NpcLockTable: !Ref NpcLockTable
          NpcBackgroundTable: !Ref NpcBackgroundTable
          ConversationTable: !Ref ConversationTable
          GameSourceTable: !Ref GameSourceTable
      Events:
        SaveK8sAccountGet:
          Type: Api 
          Properties:
            Path: /save-k8s-account
            Method: get
            RestApiId:
              Ref: ApiGatewayApi
        SaveK8sAccountPost:
          Type: Api 
          Properties:
            Path: /save-k8s-account
            Method: post
            RestApiId:
              Ref: ApiGatewayApi
        SaveK8sAccountOptions:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /save-k8s-account
            Method: options

  KeygenFunction:
    Type: AWS::Serverless::Function 
    Properties:
      CodeUri: keygen/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AccountTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ApiKeyTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TestRecordTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NpcLockTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NpcBackgroundTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GameSourceTable
        - Statement:
          - Effect: "Allow"
            Action:
              - "apigateway:POST"
              - "apigateway:GET"
            Resource:
              - !Sub "arn:aws:apigateway:${AWS::Region}::/apikeys"             
              - !Sub "arn:aws:apigateway:${AWS::Region}::/apikeys/*"
              - !Sub "arn:aws:apigateway:${AWS::Region}::/usageplans"
              - !Sub "arn:aws:apigateway:${AWS::Region}::/usageplans/*/keys" 
              - !Sub "arn:aws:apigateway:${AWS::Region}::/restapis"
              - !Sub "arn:aws:apigateway:${AWS::Region}::/restapis/*"
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: "*"
      Layers:
        - !Ref CommonLayer
      Environment:
        Variables:
          SecretHash: !Ref SecretHash          
          StageName: !Ref StageName
          ApiGateWayName: !Sub "${AWS::StackName}-api"
          UsagePlanName: !Sub "${AWS::StackName}-usage-plan"
          AccountTable: !Ref AccountTable
          ApiKeyTable: !Ref ApiKeyTable
          TestRecordTable: !Ref TestRecordTable
          NpcLockTable: !Ref NpcLockTable
          NpcBackgroundTable: !Ref NpcBackgroundTable
          ConversationTable: !Ref ConversationTable
          GameSourceTable: !Ref GameSourceTable
      Events:
        KeygenTask:
          Type: Api 
          Properties:
            Path: /keygen
            Method: get
            RestApiId:
              Ref: ApiGatewayApi
        KeygenOptions:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /keygen
            Method: options


  PostDeploymentFunction:
    Type: AWS::Serverless::Function 
    Properties:
      Timeout: 120
      CodeUri: post_deployment/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AccountTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ApiKeyTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TestRecordTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NpcLockTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NpcBackgroundTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GameSourceTable
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: "*"
      Layers:
        - !Ref CommonLayer
      Environment:
        Variables:
          SecretHash: !Ref SecretHash                 
          AccountTable: !Ref AccountTable
          ApiKeyTable: !Ref ApiKeyTable
          TestRecordTable: !Ref TestRecordTable
          NpcLockTable: !Ref NpcLockTable
          NpcBackgroundTable: !Ref NpcBackgroundTable
          ConversationTable: !Ref ConversationTable
          NCPBackgroundSheetId: !Ref NCPBackgroundSheetId
          GameSourceTable: !Ref GameSourceTable

  # New unified task handler (refactored)
  TaskHandlerFunction:
    Type: AWS::Serverless::Function 
    Properties:
      CodeUri: task-handler/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TaskStateTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NpcLockTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NpcAssignmentTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AccountTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ApiKeyTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TestRecordTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NpcBackgroundTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GameSourceTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GameAccessTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ExamCodeTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ExamSessionTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ExamWsConnectionTable
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub "arn:aws:s3:::${GameSourceBucket}/*"
        - Statement:
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ExamWebSocketApi}/${StageName}/POST/@connections/*"
        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-exam-command-durable:live"
                - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-exam-command-durable:live:*"
        - S3CrudPolicy:
            BucketName: !Ref TestResultBucket
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: "*"
      Layers:
        - !Ref LibLayer
        - !Ref CommonLayer
      Environment:
        Variables:
          TaskStateTable: !Ref TaskStateTable
          NpcLockTable: !Ref NpcLockTable
          NpcAssignmentTable: !Ref NpcAssignmentTable
          AccountTable: !Ref AccountTable
          ApiKeyTable: !Ref ApiKeyTable
          TestRecordTable: !Ref TestRecordTable
          NpcBackgroundTable: !Ref NpcBackgroundTable
          ConversationTable: !Ref ConversationTable
          GameSourceTable: !Ref GameSourceTable
          GameAccessTable: !Ref GameAccessTable
          ExamCodeTable: !Ref ExamCodeTable
          ExamSessionTable: !Ref ExamSessionTable
          ExamWsConnectionTable: !Ref ExamWsConnectionTable
          TestResultBucket: !Ref TestResultBucket
          SecretHash: !Ref SecretHash
          EasterEggSheetId: !Ref EasterEggSheetId
          ExamWebSocketManagementEndpoint: !Sub "https://${ExamWebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}"
          ExamWebSocketUrl: !Sub "wss://${ExamWebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}"
          ExamCommandDurableFunctionArn: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-exam-command-durable:live"
      Events:
        TaskApi:
          Type: Api 
          Properties:
            Path: /task
            Method: get
            RestApiId:
              Ref: ApiGatewayApi
        TaskApiOptions:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /task
            Method: options
        ExamVerifyCode:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /exam/verify-code
            Method: get
        ExamVerifyCodeOptions:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /exam/verify-code
            Method: options
        ExamStart:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /exam/start
            Method: get
        ExamStartOptions:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /exam/start
            Method: options
        ExamReset:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /exam/reset
            Method: get
        ExamResetOptions:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /exam/reset
            Method: options
        ExamRun:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /exam/run
            Method: get
        ExamRunOptions:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /exam/run
            Method: options
        ExamStatus:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /exam/status
            Method: get
        ExamStatusOptions:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /exam/status
            Method: options
        ExamRecords:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /exam/records
            Method: get
        ExamRecordsOptions:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /exam/records
            Method: options

  ExamCommandDurableFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-exam-command-durable"
      CodeUri: exam-durable-handler/
      AutoPublishAlias: live
      AutoPublishAliasAllProperties: true
      DurableConfig:
        ExecutionTimeout: 3600
        RetentionPeriodInDays: 14
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicDurableExecutionRolePolicy
        - DynamoDBCrudPolicy:
            TableName: !Ref TaskStateTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AccountTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ApiKeyTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TestRecordTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NpcBackgroundTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GameSourceTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GameAccessTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ExamCodeTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ExamSessionTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ExamWsConnectionTable
        - S3CrudPolicy:
            BucketName: !Ref TestResultBucket
        - Statement:
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ExamWebSocketApi}/${StageName}/POST/@connections/*"
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub "arn:aws:s3:::${GameSourceBucket}/*"
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: "*"
      Layers:
        - !Ref LibLayer
        - !Ref CommonLayer
      Environment:
        Variables:
          TaskStateTable: !Ref TaskStateTable
          AccountTable: !Ref AccountTable
          ApiKeyTable: !Ref ApiKeyTable
          TestRecordTable: !Ref TestRecordTable
          NpcBackgroundTable: !Ref NpcBackgroundTable
          ConversationTable: !Ref ConversationTable
          GameSourceTable: !Ref GameSourceTable
          GameAccessTable: !Ref GameAccessTable
          ExamCodeTable: !Ref ExamCodeTable
          ExamSessionTable: !Ref ExamSessionTable
          ExamWsConnectionTable: !Ref ExamWsConnectionTable
          TestResultBucket: !Ref TestResultBucket
          SecretHash: !Ref SecretHash
          EasterEggSheetId: !Ref EasterEggSheetId
          ExamWebSocketManagementEndpoint: !Sub "https://${ExamWebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}"
          ExamWebSocketUrl: !Sub "wss://${ExamWebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}"
          NpcLockTable: !Ref NpcLockTable
          NpcAssignmentTable: !Ref NpcAssignmentTable
          GameSourceBucket: !Ref GameSourceBucket

  ExamDurableProbeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-exam-durable-probe"
      CodeUri: exam-durable-probe-handler/
      AutoPublishAlias: live
      AutoPublishAliasAllProperties: true
      DurableConfig:
        ExecutionTimeout: 3600
        RetentionPeriodInDays: 14
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicDurableExecutionRolePolicy
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: "*"

  ExamWebSocketHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: exam-ws-handler/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ExamWsConnectionTable
        - DynamoDBReadPolicy:
            TableName: !Ref TaskStateTable
        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-exam-command-durable:live"
                - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-exam-command-durable:live:*"
        - Statement:
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ExamWebSocketApi}/${StageName}/POST/@connections/*"
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: "*"
      Layers:
        - !Ref CommonLayer
      Environment:
        Variables:
          SecretHash: !Ref SecretHash
          ExamWsConnectionTable: !Ref ExamWsConnectionTable
          TaskStateTable: !Ref TaskStateTable
          ExamCommandDurableFunctionArn: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-exam-command-durable:live"

  ExamWebSocketHandlerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ExamWebSocketHandlerFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ExamWebSocketApi}/*"

  ExamWebSocketIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ExamWebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ExamWebSocketHandlerFunction.Arn}/invocations"

  ExamWebSocketConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ExamWebSocketApi
      RouteKey: $connect
      Target: !Sub "integrations/${ExamWebSocketIntegration}"

  ExamWebSocketDisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ExamWebSocketApi
      RouteKey: $disconnect
      Target: !Sub "integrations/${ExamWebSocketIntegration}"

  ExamWebSocketDefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ExamWebSocketApi
      RouteKey: $default
      Target: !Sub "integrations/${ExamWebSocketIntegration}"

  PostDeploymentCustomResource:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt PostDeploymentFunction.Arn
      ServiveTimeout: 120
    DependsOn: 
      - NpcBackgroundTable

