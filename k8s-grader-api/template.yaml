AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  SAM Template for k8s-grader-api
# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Parameters:
  SecretHash:
    Type: String
    Description: "Secret hash for secure operations"
    Default: "hyKOuny4vy94RUiYe3pB6CCwtaJeW6B_fOtqbK1PXrQ="
  StageName:
    Type: String
    Description: "Stage name for the API"
    Default: "Prod"
  EasterEggSheetId:
    Type: String
    Description: "Sheet ID for Easter Egg"
    Default: "1rxJQs32TlMDHubPgwMPgVFo3fx_hMuYRSL0ic3db9RM"
  NCPBackgroundSheetId:
    Type: String
    Description: "Sheet ID for NCP Background"
    Default: "1VdQsc9qslvd-gGhydN5dEZEX6Q5uliBQqRguJyHBZM4"
  PythonVersion:
    Type: String
    Description: "Python version for the Lambda functions"
    Default: "python3.14"
Globals:
  Function:
    Timeout: 29
    MemorySize: 512
    Handler: app.lambda_handler
    Runtime: !Ref PythonVersion
    Architectures:
      - x86_64
  Api:
    TracingEnabled: true
Resources:
  TestResultBucket:
    Type: AWS::S3::Bucket

  ApiKeyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: "email"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "email"
          KeyType: "HASH"

  AccountTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: "email"
          AttributeType: "S"
        - AttributeName: "endpoint"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "email"
          KeyType: "HASH"
      GlobalSecondaryIndexes:
        - IndexName: "EndpointIndex"
          KeySchema:
            - AttributeName: "endpoint"
              KeyType: "HASH"
          Projection:
            ProjectionType: "INCLUDE"
            NonKeyAttributes:
              - "email"

  TestRecordTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: "email"
          AttributeType: "S"
        - AttributeName: "gameTime"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "email"
          KeyType: "HASH"
        - AttributeName: "gameTime"
          KeyType: "RANGE"

  NpcLockTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: "email"
          AttributeType: "S"
        - AttributeName: "gameNpc"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "email"
          KeyType: "HASH"
        - AttributeName: "gameNpc"
          KeyType: "RANGE"
      TimeToLiveSpecification:
        AttributeName: "ttl"
        Enabled: true
  
  NpcBackgroundTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: "name"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "name"
          KeyType: "HASH"

  ConversationTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: "key"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "key"
          KeyType: "HASH"

  GameSourceTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: "game"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "game"
          KeyType: "HASH"

  SessionTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: "email"
          AttributeType: "S"
        - AttributeName: "game"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "email"
          KeyType: "HASH"
        - AttributeName: "game"
          KeyType: "RANGE"

  # New refactored tables
  TaskStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: "email"
          AttributeType: "S"
        - AttributeName: "gameTask"
          AttributeType: "S"
        - AttributeName: "status"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "email"
          KeyType: "HASH"
        - AttributeName: "gameTask"
          KeyType: "RANGE"
      GlobalSecondaryIndexes:
        - IndexName: "StatusIndex"
          KeySchema:
            - AttributeName: "email"
              KeyType: "HASH"
            - AttributeName: "status"
              KeyType: "RANGE"
          Projection:
            ProjectionType: "ALL"

  NpcAssignmentTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: "email"
          AttributeType: "S"
        - AttributeName: "game"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "email"
          KeyType: "HASH"
        - AttributeName: "game"
          KeyType: "RANGE"

# Handle CORS https://github.com/aws/serverless-application-model/issues/1786
  ApiGatewayApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "${AWS::StackName}-api"
      StageName: !Ref StageName
      Auth:
        ApiKeyRequired: true
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,x-api-key'"
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        MaxAge: "'600'"
        AllowCredentials: false

  # Gateway Responses to add CORS headers to error responses
  ApiGatewayResponse4XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,x-api-key'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
      ResponseType: DEFAULT_4XX
      RestApiId: !Ref ApiGatewayApi

  ApiGatewayResponse5XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,x-api-key'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
      ResponseType: DEFAULT_5XX
      RestApiId: !Ref ApiGatewayApi

  APIUsagePlan:
    Type: 'AWS::ApiGateway::UsagePlan'
    Properties:
      ApiStages:
        - ApiId: !Ref ApiGatewayApi
          Stage: !Ref ApiGatewayApi.Stage
      Description: To usage plan and api key in REST API.
      Quota:
        Limit: 2880
        Period: DAY
      Throttle:
        BurstLimit: 60
        RateLimit: 60
      UsagePlanName: !Sub "${AWS::StackName}-usage-plan"

  LibLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: LibLayer
      Description: A layer for shared libraries
      ContentUri: layer
      RetentionPolicy: Delete
      CompatibleRuntimes:
        - !Ref PythonVersion
    Metadata:
      BuildMethod: makefile # Required to have AWS SAM build this layer

  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: CommonLayer
      Description: Dependencies required for my Python lambdas
      ContentUri: common-layer/
      RetentionPolicy: Delete
      CompatibleRuntimes:
       - !Ref PythonVersion  
      LicenseInfo: "Apache License 2.0"
    Metadata:
      BuildMethod: !Ref PythonVersion

  SaveK8sAccountFunction:
    Type: AWS::Serverless::Function 
    Properties:
      CodeUri: save-k8s-account/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AccountTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ApiKeyTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TestRecordTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NpcLockTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NpcBackgroundTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GameSourceTable
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: "*"
      Layers:
        - !Ref LibLayer
        - !Ref CommonLayer
      Environment:
        Variables:
          AccountTable: !Ref AccountTable
          ApiKeyTable: !Ref ApiKeyTable
          SessionTable: !Ref SessionTable
          SecretHash: !Ref SecretHash
          TestRecordTable: !Ref TestRecordTable
          NpcLockTable: !Ref NpcLockTable
          NpcBackgroundTable: !Ref NpcBackgroundTable
          ConversationTable: !Ref ConversationTable
          GameSourceTable: !Ref GameSourceTable
      Events:
        SaveK8sAccountGet:
          Type: Api 
          Properties:
            Path: /save-k8s-account
            Method: get
            RestApiId:
              Ref: ApiGatewayApi
            Auth:
              ApiKeyRequired: false
        SaveK8sAccountPost:
          Type: Api 
          Properties:
            Path: /save-k8s-account
            Method: post
            RestApiId:
              Ref: ApiGatewayApi
            Auth:
              ApiKeyRequired: true

  KeygenFunction:
    Type: AWS::Serverless::Function 
    Properties:
      CodeUri: keygen/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AccountTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ApiKeyTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TestRecordTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NpcLockTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NpcBackgroundTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GameSourceTable
        - Statement:
          - Effect: "Allow"
            Action:
              - "apigateway:POST"
              - "apigateway:GET"
            Resource:
              - !Sub "arn:aws:apigateway:${AWS::Region}::/apikeys"             
              - !Sub "arn:aws:apigateway:${AWS::Region}::/apikeys/*"
              - !Sub "arn:aws:apigateway:${AWS::Region}::/usageplans"
              - !Sub "arn:aws:apigateway:${AWS::Region}::/usageplans/*/keys" 
              - !Sub "arn:aws:apigateway:${AWS::Region}::/restapis"
              - !Sub "arn:aws:apigateway:${AWS::Region}::/restapis/*"
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: "*"
      Layers:
        - !Ref CommonLayer
      Environment:
        Variables:
          SecretHash: !Ref SecretHash          
          StageName: !Ref StageName
          ApiGateWayName: !Sub "${AWS::StackName}-api"
          UsagePlanName: !Sub "${AWS::StackName}-usage-plan"
          AccountTable: !Ref AccountTable
          ApiKeyTable: !Ref ApiKeyTable
          TestRecordTable: !Ref TestRecordTable
          NpcLockTable: !Ref NpcLockTable
          NpcBackgroundTable: !Ref NpcBackgroundTable
          ConversationTable: !Ref ConversationTable
          GameSourceTable: !Ref GameSourceTable
      Events:
        KeygenTask:
          Type: Api 
          Properties:
            Path: /keygen
            Method: get
            RestApiId:
              Ref: ApiGatewayApi
            Auth:
              ApiKeyRequired: false

  PostDeploymentFunction:
    Type: AWS::Serverless::Function 
    Properties:
      Timeout: 120
      CodeUri: post_deployment/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AccountTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ApiKeyTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TestRecordTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NpcLockTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NpcBackgroundTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GameSourceTable
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: "*"
      Layers:
        - !Ref CommonLayer
      Environment:
        Variables:
          SecretHash: !Ref SecretHash                 
          AccountTable: !Ref AccountTable
          ApiKeyTable: !Ref ApiKeyTable
          TestRecordTable: !Ref TestRecordTable
          NpcLockTable: !Ref NpcLockTable
          NpcBackgroundTable: !Ref NpcBackgroundTable
          ConversationTable: !Ref ConversationTable
          NCPBackgroundSheetId: !Ref NCPBackgroundSheetId
          GameSourceTable: !Ref GameSourceTable

  # New unified task handler (refactored)
  TaskHandlerFunction:
    Type: AWS::Serverless::Function 
    Properties:
      CodeUri: task-handler/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TaskStateTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NpcLockTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NpcAssignmentTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AccountTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ApiKeyTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TestRecordTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NpcBackgroundTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GameSourceTable
        - S3CrudPolicy:
            BucketName: !Ref TestResultBucket
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: "*"
      Layers:
        - !Ref LibLayer
        - !Ref CommonLayer
      Environment:
        Variables:
          TaskStateTable: !Ref TaskStateTable
          NpcLockTable: !Ref NpcLockTable
          NpcAssignmentTable: !Ref NpcAssignmentTable
          AccountTable: !Ref AccountTable
          ApiKeyTable: !Ref ApiKeyTable
          TestRecordTable: !Ref TestRecordTable
          NpcBackgroundTable: !Ref NpcBackgroundTable
          ConversationTable: !Ref ConversationTable
          GameSourceTable: !Ref GameSourceTable
          TestResultBucket: !Ref TestResultBucket
          SecretHash: !Ref SecretHash
          EasterEggSheetId: !Ref EasterEggSheetId
      Events:
        TaskApi:
          Type: Api 
          Properties:
            Path: /task
            Method: get
            RestApiId:
              Ref: ApiGatewayApi
            Auth:
              ApiKeyRequired: true
        TaskApiCors:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /task
            Method: options
            Auth:
              ApiKeyRequired: false

  PostDeploymentCustomResource:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt PostDeploymentFunction.Arn
      ServiveTimeout: 120
    DependsOn: 
      - NpcBackgroundTable

Outputs:
  # ServerlessRestApi is an implicit API created out of Events key under Serverless::Function
  # Find out more about other implicit resources you can reference within SAM
  # https://github.com/awslabs/serverless-application-model/blob/master/docs/internals/generated_resources.rst#api
  BaseUrl:
    Description: "Base Url for the game"
    Value: !Sub "https://${ApiGatewayApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/"
  SaveK8sAccountUrl:
    Description: "Save K8s Account URL."
    Value: !Sub "https://${ApiGatewayApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/save-k8s-account/" 
  KeygenApi:
    Description: "Endpoint URL for Keygen function"
    Value: !Sub "https://${ApiGatewayApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/keygen/?secret=${SecretHash}&email="
  AccountTable:
    Description: "Name of the AccountTable"
    Value: !Ref AccountTable
  ApiKeyTable:
    Description: "Name of the ApiKeyTable"
    Value: !Ref ApiKeyTable
  TestResultBucket:
    Description: "Name of the TestResultBucket"
    Value: !Ref TestResultBucket
  SecretHash:
    Description: "Secret hash for secure operations"
    Value: !Ref SecretHash
  ApiGateWayName:
    Description: "API Gateway name"
    Value: !Sub "${AWS::StackName}-api"
  StageName:
    Description: "Stage name for the API"
    Value: !Ref StageName
  UsagePlanName:
    Description: "Usage plan name"
    Value: !Sub "${AWS::StackName}-usage-plan"
  TestRecordTable:
    Description: "Name of the TestRecordTable"
    Value: !Ref TestRecordTable
  NpcLockTable:
    Description: "Name of the NpcLockTable"
    Value: !Ref NpcLockTable
  NpcBackgroundTable:
    Description: "Name of the NpcBackgroundTable"
    Value: !Ref NpcBackgroundTable
  ConversationTable:
    Description: "Name of the ConversationTable"
    Value: !Ref ConversationTable
  GameSourceTable:
    Description: "Name of the GameSourceTable"
    Value: !Ref GameSourceTable
  SessionTable:
    Description: "Name of the SessionTable (stores K8s credentials)"
    Value: !Ref SessionTable
  TaskStateTable:
    Description: "Name of the TaskStateTable (refactored)"
    Value: !Ref TaskStateTable
  NpcAssignmentTable:
    Description: "Name of the NpcAssignmentTable (refactored)"
    Value: !Ref NpcAssignmentTable
  TaskHandlerApi:
    Description: "Endpoint URL for unified Task Handler function (refactored)"
    Value: !Sub "https://${ApiGatewayApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/task"
  GameUrl:
    Description: "Game URL and you need to replace the Student Individual API key."
    Value: !Sub "https://wongcyrus.github.io/k8s-isekai/index.html?baseUrl=https://${ApiGatewayApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/&game=game01&apiKey=INDIVIDUAL_API_KEY"
