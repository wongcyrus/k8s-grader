AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  SAM Template for k8s-grader-api
# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Parameters:
  SecretHash:
    Type: String
    Description: "Secret hash for secure operations"
    NoEcho: true
  StageName:
    Type: String
    Description: "Stage name for the API"
    Default: "Prod"
    AllowedValues:
      - Dev
      - Staging
      - Prod
  EasterEggSheetId:
    Type: String
    Description: "Sheet ID for Easter Egg"
    Default: "1rxJQs32TlMDHubPgwMPgVFo3fx_hMuYRSL0ic3db9RM"
  NCPBackgroundSheetId:
    Type: String
    Description: "Sheet ID for NCP Background"
    Default: "1VdQsc9qslvd-gGhydN5dEZEX6Q5uliBQqRguJyHBZM4"
  PythonVersion:
    Type: String
    Description: "Python version for the Lambda functions"
    Default: "python3.14"
    AllowedValues:
      - python3.11
      - python3.12
      - python3.13
      - python3.14
Globals:
  Function:
    Timeout: 29
    MemorySize: 512
    Handler: app.lambda_handler
    Runtime: !Ref PythonVersion
    Architectures:
      - x86_64
    Tracing: Active
    Environment:
      Variables:
        POWERTOOLS_SERVICE_NAME: k8s-grader
        LOG_LEVEL: INFO
  Api:
    TracingEnabled: true
Resources:
  TestResultBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldTestResults
            Status: Enabled
            ExpirationInDays: 90

  ApiKeyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: "email"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "email"
          KeyType: "HASH"
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  AccountTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: "email"
          AttributeType: "S"
        - AttributeName: "endpoint"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "email"
          KeyType: "HASH"
      GlobalSecondaryIndexes:
        - IndexName: "EndpointIndex"
          KeySchema:
            - AttributeName: "endpoint"
              KeyType: "HASH"
          Projection:
            ProjectionType: "INCLUDE"
            NonKeyAttributes:
              - "email"
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  GameTaskTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: "email"
          AttributeType: "S"
        - AttributeName: "game"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "email"
          KeyType: "HASH"
        - AttributeName: "game"
          KeyType: "RANGE"
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  SessionTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: "email"
          AttributeType: "S"
        - AttributeName: "game"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "email"
          KeyType: "HASH"
        - AttributeName: "game"
          KeyType: "RANGE"
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  TestRecordTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: "email"
          AttributeType: "S"
        - AttributeName: "gameTime"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "email"
          KeyType: "HASH"
        - AttributeName: "gameTime"
          KeyType: "RANGE"
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
  
  NpcTaskTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: "email"
          AttributeType: "S"
        - AttributeName: "game"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "email"
          KeyType: "HASH"
        - AttributeName: "game"
          KeyType: "RANGE"
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  NpcLockTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: "email"
          AttributeType: "S"
        - AttributeName: "gameNpc"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "email"
          KeyType: "HASH"
        - AttributeName: "gameNpc"
          KeyType: "RANGE"
      TimeToLiveSpecification:
        AttributeName: "ttl"
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
  
  NpcBackgroundTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: "name"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "name"
          KeyType: "HASH"
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  ConversationTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: "key"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "key"
          KeyType: "HASH"
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  GameSourceTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: "game"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "game"
          KeyType: "HASH"
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

# Handle CORS https://github.com/aws/serverless-application-model/issues/1786
  ApiGatewayApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "${AWS::StackName}-api"
      StageName: !Ref StageName
      Auth:
        ApiKeyRequired: true
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,x-api-key'"
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        MaxAge: "'600'"
        AllowCredentials: false

  # Gateway Responses to add CORS headers to error responses
  ApiGatewayResponse4XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,x-api-key'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
      ResponseType: DEFAULT_4XX
      RestApiId: !Ref ApiGatewayApi

  ApiGatewayResponse5XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,x-api-key'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
      ResponseType: DEFAULT_5XX
      RestApiId: !Ref ApiGatewayApi

  APIUsagePlan:
    Type: 'AWS::ApiGateway::UsagePlan'
    DependsOn: ApiGatewayApiProdStage
    Properties:
      ApiStages:
        - ApiId: !Ref ApiGatewayApi
          Stage: !Ref StageName
      Description: Usage plan and api key for REST API
      Quota:
        Limit: 2880
        Period: DAY
      Throttle:
        BurstLimit: 60
        RateLimit: 60
      UsagePlanName: !Sub "${AWS::StackName}-usage-plan"

  LibLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: LibLayer
      Description: A layer for shared libraries
      ContentUri: layer
      RetentionPolicy: Delete
      CompatibleRuntimes:
        - !Ref PythonVersion
    Metadata:
      BuildMethod: makefile # Required to have AWS SAM build this layer

  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: CommonLayer
      Description: Dependencies required for my Python lambdas
      ContentUri: common-layer/
      RetentionPolicy: Delete
      CompatibleRuntimes:
       - !Ref PythonVersion  
      LicenseInfo: "Apache License 2.0"
    Metadata:
      BuildMethod: !Ref PythonVersion

  GameTaskFunction:
    Type: AWS::Serverless::Function 
    Properties:
      CodeUri: game_task/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AccountTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTaskTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ApiKeyTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TestRecordTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NpcTaskTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NpcLockTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NpcBackgroundTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GameSourceTable
        - S3CrudPolicy:
            BucketName: !Ref TestResultBucket
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*"
            - Effect: Allow
              Action:
                - xray:PutTraceSegments
                - xray:PutTelemetryRecords
              Resource: "*"
      Layers:
        - !Ref LibLayer
        - !Ref CommonLayer
      Environment:
        Variables:
          AccountTable: !Ref AccountTable
          SessionTable: !Ref SessionTable
          GameTaskTable: !Ref GameTaskTable
          ApiKeyTable: !Ref ApiKeyTable
          TestResultBucket: !Ref TestResultBucket
          SecretHash: !Ref SecretHash
          TestRecordTable: !Ref TestRecordTable
          NpcTaskTable: !Ref NpcTaskTable
          NpcLockTable: !Ref NpcLockTable
          NpcBackgroundTable: !Ref NpcBackgroundTable
          ConversationTable: !Ref ConversationTable
          EasterEggSheetId: !Ref EasterEggSheetId
          GameSourceTable: !Ref GameSourceTable
      Events:
        GameTask:
          Type: Api 
          Properties:
            Path: /game-task
            Method: get
            RestApiId:
              Ref: ApiGatewayApi
            Auth:
              ApiKeyRequired: true
        ProxyApiCors:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /game-task
            Method: options
            Auth:
              ApiKeyRequired: false

  GraderFunction:
    Type: AWS::Serverless::Function 
    Properties:
      CodeUri: grader/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AccountTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTaskTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ApiKeyTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TestRecordTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NpcTaskTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NpcLockTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NpcBackgroundTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GameSourceTable
        - S3CrudPolicy:
            BucketName: !Ref TestResultBucket
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${GraderFunction}:*"
            - Effect: Allow
              Action:
                - xray:PutTraceSegments
                - xray:PutTelemetryRecords
              Resource: "*"
      Layers:
        - !Ref LibLayer
        - !Ref CommonLayer
      Environment:
        Variables:
          AccountTable: !Ref AccountTable
          SessionTable: !Ref SessionTable
          GameTaskTable: !Ref GameTaskTable
          ApiKeyTable: !Ref ApiKeyTable
          TestResultBucket: !Ref TestResultBucket
          SecretHash: !Ref SecretHash
          TestRecordTable: !Ref TestRecordTable
          NpcTaskTable: !Ref NpcTaskTable
          NpcLockTable: !Ref NpcLockTable
          NpcBackgroundTable: !Ref NpcBackgroundTable
          ConversationTable: !Ref ConversationTable
          EasterEggSheetId: !Ref EasterEggSheetId
          GameSourceTable: !Ref GameSourceTable
      Events:
        GameTask:
          Type: Api 
          Properties:
            Path: /grader
            Method: get
            RestApiId:
              Ref: ApiGatewayApi
            Auth:
              ApiKeyRequired: true
        ProxyApiCors:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /grader
            Method: options
            Auth:
              ApiKeyRequired: false
              
  SaveK8sAccountFunction:
    Type: AWS::Serverless::Function 
    Properties:
      CodeUri: save-k8s-account/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AccountTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTaskTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ApiKeyTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TestRecordTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NpcTaskTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NpcLockTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NpcBackgroundTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GameSourceTable
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${SaveK8sAccountFunction}:*"
            - Effect: Allow
              Action:
                - xray:PutTraceSegments
                - xray:PutTelemetryRecords
              Resource: "*"
      Layers:
        - !Ref LibLayer
        - !Ref CommonLayer
      Environment:
        Variables:
          AccountTable: !Ref AccountTable
          SessionTable: !Ref SessionTable
          GameTaskTable: !Ref GameTaskTable
          ApiKeyTable: !Ref ApiKeyTable
          SecretHash: !Ref SecretHash
          TestRecordTable: !Ref TestRecordTable
          NpcTaskTable: !Ref NpcTaskTable
          NpcLockTable: !Ref NpcLockTable
          NpcBackgroundTable: !Ref NpcBackgroundTable
          ConversationTable: !Ref ConversationTable
          GameSourceTable: !Ref GameSourceTable
      Events:
         SaveK8sAccountGet:
          Type: Api 
          Properties:
            Path: /save-k8s-account
            Method: get
            RestApiId:
              Ref: ApiGatewayApi
            Auth:
              ApiKeyRequired: false
         SaveK8sAccountPost:
          Type: Api 
          Properties:
            Path: /save-k8s-account
            Method: post
            RestApiId:
              Ref: ApiGatewayApi
            Auth:
              ApiKeyRequired: true

  KeygenFunction:
    Type: AWS::Serverless::Function 
    Properties:
      CodeUri: keygen/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AccountTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTaskTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ApiKeyTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TestRecordTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NpcTaskTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NpcLockTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NpcBackgroundTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GameSourceTable
        - Statement:
          - Effect: "Allow"
            Action:
              - "apigateway:POST"
              - "apigateway:GET"
            Resource:
              - !Sub "arn:aws:apigateway:${AWS::Region}::/apikeys"             
              - !Sub "arn:aws:apigateway:${AWS::Region}::/apikeys/*"
              - !Sub "arn:aws:apigateway:${AWS::Region}::/usageplans"
              - !Sub "arn:aws:apigateway:${AWS::Region}::/usageplans/*/keys" 
              - !Sub "arn:aws:apigateway:${AWS::Region}::/restapis"
              - !Sub "arn:aws:apigateway:${AWS::Region}::/restapis/*"
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${KeygenFunction}:*"
            - Effect: Allow
              Action:
                - xray:PutTraceSegments
                - xray:PutTelemetryRecords
              Resource: "*"
      Layers:
        - !Ref CommonLayer
      Environment:
        Variables:
          SecretHash: !Ref SecretHash          
          StageName: !Ref StageName
          ApiGateWayName: !Sub "${AWS::StackName}-api"
          UsagePlanName: !Sub "${AWS::StackName}-usage-plan"
          AccountTable: !Ref AccountTable
          SessionTable: !Ref SessionTable
          GameTaskTable: !Ref GameTaskTable
          ApiKeyTable: !Ref ApiKeyTable
          TestRecordTable: !Ref TestRecordTable
          NpcTaskTable: !Ref NpcTaskTable
          NpcLockTable: !Ref NpcLockTable
          NpcBackgroundTable: !Ref NpcBackgroundTable
          ConversationTable: !Ref ConversationTable
          GameSourceTable: !Ref GameSourceTable
      Events:
        KeygenTask:
          Type: Api 
          Properties:
            Path: /keygen
            Method: get
            RestApiId:
              Ref: ApiGatewayApi
            Auth:
              ApiKeyRequired: false

  PostDeploymentFunction:
    Type: AWS::Serverless::Function 
    Properties:
      Timeout: 120
      CodeUri: post_deployment/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AccountTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTaskTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ApiKeyTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TestRecordTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NpcTaskTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NpcLockTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NpcBackgroundTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GameSourceTable
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${PostDeploymentFunction}:*"
            - Effect: Allow
              Action:
                - xray:PutTraceSegments
                - xray:PutTelemetryRecords
              Resource: "*"
      Layers:
        - !Ref CommonLayer
      Environment:
        Variables:
          SecretHash: !Ref SecretHash                 
          AccountTable: !Ref AccountTable
          SessionTable: !Ref SessionTable
          GameTaskTable: !Ref GameTaskTable
          ApiKeyTable: !Ref ApiKeyTable
          TestRecordTable: !Ref TestRecordTable
          NpcTaskTable: !Ref NpcTaskTable
          NpcLockTable: !Ref NpcLockTable
          NpcBackgroundTable: !Ref NpcBackgroundTable
          ConversationTable: !Ref ConversationTable
          NCPBackgroundSheetId: !Ref NCPBackgroundSheetId
          GameSourceTable: !Ref GameSourceTable

  PostDeploymentCustomResource:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt PostDeploymentFunction.Arn
      ServiveTimeout: 120
    DependsOn: 
      - NpcBackgroundTable

Outputs:
  # ServerlessRestApi is an implicit API created out of Events key under Serverless::Function
  # Find out more about other implicit resources you can reference within SAM
  # https://github.com/awslabs/serverless-application-model/blob/master/docs/internals/generated_resources.rst#api
  BaseUrl:
    Description: "Base Url for the game"
    Value: !Sub "https://${ApiGatewayApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/"
  SaveK8sAccountUrl:
    Description: "Save K8s Account URL."
    Value: !Sub "https://${ApiGatewayApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/save-k8s-account/" 
  KeygenApi:
    Description: "Endpoint URL for Keygen function"
    Value: !Sub "https://${ApiGatewayApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/keygen/?secret=${SecretHash}&email="
  AccountTable:
    Description: "Name of the AccountTable"
    Value: !Ref AccountTable
  GameTaskTable:
    Description: "Name of the GameTaskTable"
    Value: !Ref GameTaskTable
  SessionTable:
    Description: "Name of the SessionTable"
    Value: !Ref SessionTable
  ApiKeyTable:
    Description: "Name of the ApiKeyTable"
    Value: !Ref ApiKeyTable
  TestResultBucket:
    Description: "Name of the TestResultBucket"
    Value: !Ref TestResultBucket
  SecretHash:
    Description: "Secret hash for secure operations"
    Value: !Ref SecretHash
  ApiGateWayName:
    Description: "API Gateway name"
    Value: !Sub "${AWS::StackName}-api"
  StageName:
    Description: "Stage name for the API"
    Value: !Ref StageName
  UsagePlanName:
    Description: "Usage plan name"
    Value: !Sub "${AWS::StackName}-usage-plan"
  TestRecordTable:
    Description: "Name of the TestRecordTable"
    Value: !Ref TestRecordTable
  NpcTaskTable:
    Description: "Name of the NpcTaskTable"
    Value: !Ref NpcTaskTable
  NpcLockTable:
    Description: "Name of the NpcLockTable"
    Value: !Ref NpcLockTable
  NpcBackgroundTable:
    Description: "Name of the NpcBackgroundTable"
    Value: !Ref NpcBackgroundTable
  ConversationTable:
    Description: "Name of the ConversationTable"
    Value: !Ref ConversationTable
  GameSourceTable:
    Description: "Name of the GameSourceTable"
    Value: !Ref GameSourceTable
  GameUrl:
    Description: "Game URL and you need to replace the Student Individual API key."
    Value: !Sub "https://wongcyrus.github.io/k8s-isekai/index.html?baseUrl=https://${ApiGatewayApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/&game=game01&apiKey=INDIVIDUAL_API_KEY"
